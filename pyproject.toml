[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wefunder"
dynamic = ["version"]
description = "Official Python SDK for the Wefunder API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Wefunder", email = "api@wefunder.com" }]
keywords = ["wefunder", "api", "sdk", "crowdfunding", "oauth", "webhooks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
# httpx is the transport; attrs + python-dateutil are what openapi-python-client's
# generated models need at runtime. Nothing else.
dependencies = [
  "httpx>=0.27,<1",
  "attrs>=22.2",
  "python-dateutil>=2.8",
]

[project.urls]
Homepage = "https://github.com/Wefunder/wefunder-python"
Documentation = "https://docs.wefunder.com"
Source = "https://github.com/Wefunder/wefunder-python"
Issues = "https://github.com/Wefunder/wefunder-python/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "ruff==0.16.9",
  "pyright>=1.1.400",
  # Pinned: the generated-in-sync gate regenerates with exactly this version.
  "openapi-python-client==0.29.1",
  "pyyaml>=6",
  "build>=1.2",
]

[tool.hatch.version]
path = "src/wefunder/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wefunder"]

[tool.hatch.build.targets.sdist]
include = ["src/wefunder", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["src/wefunder/_generated"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E731"]

[tool.pyright]
pythonVersion = "3.11"
include = ["src/wefunder", "tests", "examples", "scripts"]
exclude = ["src/wefunder/_generated"]
extraPaths = ["scripts", "examples"]
typeCheckingMode = "standard"
reportMissingModuleSource = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --ignore=tests/e2e"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
