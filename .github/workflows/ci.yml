name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests scripts examples
      - run: ruff format --check src tests scripts examples
      - run: pyright
      - run: pytest
      - run: python -m build

  generated-in-sync:
    name: generated code matches spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # The committed src/wefunder/_generated must match what the pinned generator
      # emits from spec/openapi.yaml. If this fails, run `python scripts/generate.py`
      # and commit the result.
      - run: python scripts/generate.py
      - run: git diff --exit-code -- src/wefunder/_generated

  e2e:
    name: live sandbox e2e
    # Never on pull_request: keeps the sandbox secret away from fork PRs.
    # Runs on push to main and manual dispatch; auto-skips if the secret is unset.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      WEFUNDER_CLIENT_ID: ${{ secrets.WEFUNDER_CLIENT_ID }}
      WEFUNDER_CLIENT_SECRET: ${{ secrets.WEFUNDER_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest tests/e2e -o addopts=""
